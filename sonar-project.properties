# Managed by star-config. Used by `star-config sonar scan` (local SonarQube in Docker).
sonar.projectKey=star-config
sonar.projectName=star-config
sonar.sources=src
sonar.exclusions=**/node_modules/**,**/.venv/**,**/target/**,**/dist/**,**/build/**,**/coverage/**
sonar.tests=.
sonar.test.inclusions=**/*.test.*,**/*.spec.*,**/test_*.py,**/tests/**,**/*.bats
sonar.javascript.lcov.reportPaths=coverage/lcov.info
