# star-config — local SonarQube for SonarLint "connected mode" and CLI scans.
# Bound to 127.0.0.1 only: source code and findings never leave this machine.
# Managed by `star-config sonar up|scan|down`.
name: star-sonarqube
services:
  sonarqube:
    image: sonarqube:26.10.0.133078-community
    depends_on:
      db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${STAR_SONAR_DB_PASSWORD:?run via star-config sonar up}
      SONAR_TELEMETRY_ENABLE: "false"
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget -qO- http://localhost:9000/api/system/status | grep -q ''"status":"UP"''',
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${STAR_SONAR_DB_PASSWORD:?run via star-config sonar up}
      POSTGRES_DB: sonar
    volumes:
      - postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgresql:
