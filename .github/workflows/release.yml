name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Dependabot merge]
    types: [completed]

permissions:
  contents: read

concurrency:
  # Skipped reconciliation events must not replace a queued publishing run.
  group: ${{ github.event_name == 'workflow_run' && (github.event.workflow_run.conclusion != 'success' || github.event.workflow_run.head_sha == github.sha) && 'release-noop' || 'release' }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_sha != github.sha)
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.event_name == 'push' && github.sha || 'main' }}

  plan:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-plan.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  package:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: native-fs-macOS-*
          path: build/native
          merge-multiple: true
      - name: Stamp artifact version without modifying Git history
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --ignore-scripts --allow-same-version
      - run: npm run build
        env:
          STAR_CONFIG_REQUIRE_NATIVE: "1"
      - run: npm run test:package
      - run: mkdir -p artifacts && npm pack ./build/package --ignore-scripts --pack-destination artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: npm-package
          path: artifacts/*.tgz
          if-no-files-found: error

  binaries:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-24.04, asset: star-config-linux-x64 }
          - { os: ubuntu-24.04-arm, asset: star-config-linux-arm64 }
          - { os: macos-15, asset: star-config-darwin-arm64 }
          - { os: macos-15-intel, asset: star-config-darwin-x64 }
          - { os: windows-2025, asset: star-config-windows-x64.exe }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Stamp version
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --ignore-scripts --allow-same-version
      - name: Build the macOS filesystem companion
        if: runner.os == 'macOS'
        run: node scripts/prepare-native.mjs
      - run: node scripts/build-sea.mjs
      - name: Smoke test and compress
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          test "$(./dist/"$ASSET" --version)" = "$VERSION"
          gzip -9 -n -c "dist/$ASSET" > "dist/$ASSET.gz"
          if [ "$RUNNER_OS" = macOS ]; then
            for module in dist/managed-fs-*.node; do
              gzip -9 -n -c "$module" > "$module.gz"
            done
          fi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.gz
            dist/managed-fs-*.node
            dist/managed-fs-*.node.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}.gz
            dist/managed-fs-*.node.gz
          if-no-files-found: error

  publish:
    needs: [plan, package, binaries]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/publish-package.mjs
            install.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: assets
          merge-multiple: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Isolate npm configuration
        run: install -m 600 /dev/null "$RUNNER_TEMP/star-config-npm-global"
      - name: Publish exact verified tarball using npm OIDC
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          NPM_CONFIG_USERCONFIG: /dev/null
          NPM_CONFIG_GLOBALCONFIG: ${{ runner.temp }}/star-config-npm-global
        run: node scripts/publish-package.mjs assets/*.tgz "$VERSION"
      - name: Create checksums
        working-directory: assets
        run: sha256sum ./*.gz ./*.tgz | sed 's#\./##' > SHA256SUMS
      - name: Publish or repair GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$SHA" --title "$TAG" --notes-file assets/release-notes.md
          fi
          for file in assets/*.gz assets/*.tgz assets/SHA256SUMS install.sh; do
            name=$(basename "$file")
            digest=$(sha256sum "$file" | cut -d' ' -f1)
            existing=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq ".assets[] | select(.name == \"$name\") | .digest")
            if [ -n "$existing" ]; then
              test "$existing" = "sha256:$digest" || { echo "Existing asset differs: $name" >&2; exit 1; }
            else
              gh release upload "$TAG" "$file"
            fi
          done
