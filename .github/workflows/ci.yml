# Pin every action to a full commit SHA before enabling (see CVE-2026-33634: mutable action tags
# were force-pushed to credential stealers). Dependabot keeps the SHAs current.
name: ci
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
    outputs:
      sha:
        value: ${{ jobs.verify.outputs.sha }}
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - run: npm ci --ignore-scripts
      - run: node scripts/prepare-native.mjs
      - name: Install polyglot test prerequisites
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python pytest==9.1.1
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: npm run typecheck
      - name: Runtime unit contracts
        run: python3 -I -m pytest -q runtime/test_runtime.py
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run test:package
      - name: Qualify real Git hook dispatch in the ephemeral runner
        run: |
          # Secure the fixture's parent without changing any installed tool directories.
          test -d /opt
          test ! -L /opt
          sudo chown root:root /opt
          sudo chmod 0755 /opt
          sudo --preserve-env=PATH env STAR_CONFIG_TEST_HOST_FIXTURE=1 npm test -- test/git-hook-dispatch.test.js
      - run: node bin/star-config.js lint
      - run: node bin/star-config.js audit
      - name: Prepare artifact round trip
        run: node -e "require('node:fs').writeFileSync('artifact-smoke.txt', 'star-config')"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dependency-smoke
          path: artifact-smoke.txt
          if-no-files-found: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dependency-smoke
          path: artifact-smoke
      - run: cmp artifact-smoke.txt artifact-smoke/artifact-smoke.txt

  native-filesystem:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts
      - run: node scripts/prepare-native.mjs
      - name: Qualify native filesystem and reversible initialization
        run: npm test -- test/managed-native.test.js test/managed-files.test.js test/initialize.test.js test/initialization-backups.test.js
        env:
          STAR_CONFIG_NATIVE_FS_TEST: "1"
          STAR_CONFIG_REQUIRE_NATIVE_TESTS: "1"
      - run: npm run build
      - run: npm run test:package
      - name: Stage the platform filesystem module
        run: node -e "const fs=require('node:fs');fs.mkdirSync('native-artifact');fs.copyFileSync('build/native/managed-fs-'+process.platform+'-'+process.arch+'.node','native-artifact/managed-fs-'+process.platform+'-'+process.arch+'.node')"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-fs-${{ runner.os }}-${{ runner.arch }}
          path: native-artifact/*.node
          if-no-files-found: error
          retention-days: 7
