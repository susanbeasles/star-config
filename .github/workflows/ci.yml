# Pin every action to a full commit SHA before enabling (see CVE-2026-33634: mutable action tags
# were force-pushed to credential stealers). Dependabot keeps the SHAs current.
name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      - run: npm ci
      - name: Install polyglot test prerequisites
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python pytest==9.1.1
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: node bin/star-config.js lint
      - run: node bin/star-config.js audit
      - name: Prepare artifact round trip
        run: node -e "require('node:fs').writeFileSync('artifact-smoke.txt', 'star-config')"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dependency-smoke
          path: artifact-smoke.txt
          if-no-files-found: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dependency-smoke
          path: artifact-smoke
      - run: cmp artifact-smoke.txt artifact-smoke/artifact-smoke.txt
